name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      USE_REDIS: "false"
      STT_PROVIDER: whisper_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart httpx pytest pytest-asyncio requests pypdf redis websockets numpy
      - name: Run backend tests
        run: pytest backend
